# Board: ESP32-C3 DevKitM-1 (Espressif)
# Definition: definitions/boards/esp32-c3-devkitm-1/manifest.yaml

esphome:
  name: plaf109
  friendly_name: Polar Wet Food Feeder
  on_boot:
    then:
      - output.turn_on: chime_pin
      - output.turn_on: presence_emitter
      - component.update: hardware_version
      - component.update: pet_visit_count
      - component.update: pet_total_time
      - component.update: last_visit_duration
      - component.update: last_visit_time
      - &apply-status-led
        script.execute: apply_status_led
      - script.execute:
          id: door_toggle

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret plaf109__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: PLAF109 Fallback Hotspot
    password: !secret plaf109__hotspot_password
  on_connect:
    - *apply-status-led
  on_disconnect:
    - *apply-status-led
captive_portal:
  id: plaf109_fallback
web_server:
  port: 80
  version: 3
  auth:
    username: !secret plaf109__web_user
    password: !secret plaf109__web_password
    type: digest
  sorting_groups:
    - id: core
      name: "Door & Plate"
      sorting_weight: 10
    - id: feed
      name: "Feed Plans"
      sorting_weight: 20
    - id: presence
      name: "Pet Presence"
      sorting_weight: 30
    - id: cooling
      name: "Cooling"
      sorting_weight: 40
    - id: power
      name: "Power"
      sorting_weight: 50
    - id: miscellaneous
      name: "Miscellaneous"
      sorting_weight: 60

debug:

i2c:
  sda: GPIO7
  scl: GPIO8
  scan: false

external_components:
  - source: github://jenscski/esphome-components@main
    components: [aw9523]

aw9523:
  id: expander

globals:
  - id: reset_button_press_start
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: lid_closed
    type: bool
    initial_value: "false"
  - id: visit_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: total_visit_seconds
    type: float
    restore_value: yes
    initial_value: '0'
  - id: last_visit_seconds
    type: float
    restore_value: yes
    initial_value: '0'
  - id: visit_start_time
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: visit_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: missed_meal_warning
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: pet_arrival_time
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_visit_epoch
    type: uint32_t
    restore_value: yes
    initial_value: '0'

time:
  - platform: sntp
    id: sntp_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(visit_count) = 0;
              id(total_visit_seconds) = 0;
              id(missed_meal_warning) = false;
              id(last_visit_duration).publish_state(0);
          - component.update: pet_visit_count
          - component.update: pet_total_time
          - *apply-status-led

script:
  - id: status_led_alternate
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - light.turn_off: led_red
            - light.turn_on:
                id: led_white
                effect: none
            - delay: 1s
            - light.turn_off: led_white
            - light.turn_on:
                id: led_red
                effect: none
            - delay: 1s
  - id: apply_status_led
    then:
      - script.stop: status_led_alternate
      - light.turn_off: led_white
      - light.turn_off: led_red
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - if:
                condition: &missed-meal
                  lambda: return id(missed_meal_warning);
                then:
                  - script.execute: status_led_alternate
                else:
                  - light.turn_on:
                      id: led_white
                      effect: Pulse
          else:
            - if:
                condition: *missed-meal
                then:
                  - light.turn_on:
                      id: led_red
                      effect: Pulse
                else:
                  - if:
                      condition:
                        switch.is_on: status_led
                      then:
                        - light.turn_on:
                            id: led_white
                            effect: none
  - id: door_toggle
    mode: single
    then:
      - lambda: id(lid_closed) = !id(lid_closed);
      - switch.turn_on: door_grating_sensor_power
      - delay: 300ms
      - if:
          condition: &lid-closed
            lambda: return id(lid_closed);
          then:
            - switch.turn_on: lid_close_pin
          else:
            - switch.turn_on: lid_open_pin
      - wait_until:
          condition:
            binary_sensor.is_off: door_grating_raw
          timeout: 800ms
      - if:
          condition:
            binary_sensor.is_on: door_grating_raw
          then:
            - logger.log:
                format: grate did not turn off when toggling door
                level: WARN
                tag: lid
          else:
            - wait_until:
                condition:
                  binary_sensor.is_on: door_grating_raw
                timeout: 6s
      - if:
          condition: *lid-closed
          then:
            - switch.turn_off: lid_close_pin
          else:
            - delay: 200ms
            - switch.turn_off: lid_open_pin
      - switch.turn_off: door_grating_sensor_power
  - id: feed_script
    mode: single
    parameters:
      manual: bool
    then:
      - button.press: chime
      - if:
          condition: *lid-closed
          then:
            - script.execute: door_toggle
      - wait_until:
          condition:
            binary_sensor.is_on: presence_detector
          timeout: !lambda return id(arrival_timeout).state * 60000;
      - if:
          condition:
            binary_sensor.is_on: presence_detector
          then:
            - logger.log:
                format: "pet has arrived for feeding"
                tag: feeding
            - lambda: id(pet_arrival_time) = millis();
            - wait_until:
                condition:
                  lambda: return id(lid_closed) || millis() - id(pet_arrival_time) >= (id(minimum_feeding_time).state * 60000);
            - logger.log:
                format: "configured feeding time is over"
                tag: feeding
            - wait_until:
                condition:
                  or:
                    - lambda: 'return id(lid_closed);'  # user may have closed lid early
                    - binary_sensor.is_off: presence_detector
            - logger.log:
                format: "pet has finished feeding"
                tag: feeding
            - &close-lid  # close lid before rotating
              if:
                condition:  # user may have closed lid early
                  lambda: return !id(lid_closed);
                then:
                  - script.execute: door_toggle
            - script.wait: door_toggle
            - button.press: rotate_plate  # rotate only after feeding
            - if:  # a manual feed catches the plate back up
                condition:
                  lambda: return manual && id(missed_meal_warning);
                then:
                  - logger.log:
                      format: "manual feed caught the plate up, clearing missed meal warning"
                      level: INFO
                      tag: feeding
                  - lambda: id(missed_meal_warning) = false;
                  - *apply-status-led
          else:
            - logger.log:
                format: "pet did not come for meal in %.0f minute window, so plate was not rotated"
                args: ['id(arrival_timeout).state']
                level: WARN
                tag: feeding
            - lambda: id(missed_meal_warning) = true;
            - *apply-status-led
      - *close-lid

number:
  - platform: template
    name: "Food Cooling Target"
    id: cooling_target
    icon: "mdi:thermometer-chevron-down"
    web_server:
      sorting_group_id: cooling
    unit_of_measurement: "°F"
    device_class: temperature
    min_value: 30
    max_value: 70
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 55  # stock target is 13°C
  - platform: template
    name: "Arrival Timeout"
    id: arrival_timeout
    icon: "mdi:timer-outline"
    web_server:
      sorting_group_id: feed
    unit_of_measurement: min
    min_value: 1
    max_value: 60
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 10
  - platform: template
    name: "Minimum Feeding Time"
    id: minimum_feeding_time
    icon: "mdi:door-open"
    web_server:
      sorting_group_id: feed
    unit_of_measurement: min
    min_value: 0
    max_value: 120
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 3
output:
  - platform: ledc
    id: presence_emitter
    pin: GPIO2
    frequency: 38000Hz
    max_power: 50%
  - platform: gpio
    id: chime_pin
    pin: GPIO6
  - platform: gpio
    id: led_white_output
    pin:
      aw9523: expander
      number: 9
      mode:
        output: true
  - platform: gpio
    id: led_red_output
    pin:
      aw9523: expander
      number: 8
      mode:
        output: true

light:
  - platform: binary
    id: led_white
    output: led_white_output
    internal: true
    restore_mode: ALWAYS_ON  # matches the status led switch default
    effects: &led_effects
      - strobe:
          name: Pulse
          colors:
            - state: true
              duration: 1s
            - state: false
              duration: 1s
  - platform: binary
    id: led_red
    output: led_red_output
    internal: true
    restore_mode: ALWAYS_OFF
    effects: *led_effects

switch:
  - platform: gpio
    id: lid_open_pin
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      aw9523: expander
      number: 15
      mode:
        output: true
      inverted: true
    interlock: [lid_close_pin]
    interlock_wait_time: 250ms
  - platform: gpio
    id: lid_close_pin
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      aw9523: expander
      number: 14
      mode:
        output: true
      inverted: true
    interlock: [lid_open_pin]
    interlock_wait_time: 250ms
  - platform: gpio
    id: plate_p0_5
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      aw9523: expander
      number: 5
      mode:
        output: true
  - platform: gpio
    id: plate_p0_6
    internal: true
    pin:
      aw9523: expander
      number: 6
      mode:
        output: true
      inverted: true
  - platform: gpio
    id: plate_grating_sensor_power
    restore_mode: ALWAYS_OFF  # disable when not in use to save battery
    pin:
      aw9523: expander
      number: 4
      mode:
        output: true
    internal: true
  - platform: gpio
    id: door_grating_sensor_power
    restore_mode: ALWAYS_OFF  # disable when not in use to save battery
    pin:
      aw9523: expander
      number: 7
      mode:
        output: true
    internal: true
  - platform: gpio
    id: tec_control_pin
    internal: true
    restore_mode: ALWAYS_OFF  # after first valid temp from sensor, will toggle on
    pin:
      aw9523: expander
      number: 12
      mode:
        output: true
  - platform: template
    id: toggle_door_closed
    internal: true
    turn_on_action: &door_toggle_action
      - script.execute:
          id: door_toggle
    turn_off_action: *door_toggle_action
    lambda: return id(lid_closed);
  - platform: template
    name: "Cooling Enabled"
    id: cooling_enabled
    icon: "mdi:snowflake"
    web_server:
      sorting_group_id: cooling
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - switch.turn_off: tec_control_pin
    optimistic: true
  - platform: template
    name: "Feeding Schedule"
    id: feeding_schedule_enabled
    icon: "mdi:calendar-clock"
    web_server:
      sorting_group_id: feed
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Status LED"
    id: status_led
    icon: "mdi:led-on"
    web_server:
      sorting_group_id: miscellaneous
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - *apply-status-led
sensor:
  - platform: adc
    pin: GPIO4
    name: "Battery Voltage"
    id: battery_voltage
    icon: "mdi:battery-charging-outline"
    web_server:
      sorting_group_id: power
    update_interval: 30s
    attenuation: auto
    internal: true
    filters:
      - multiply: 2.0
  - platform: copy
    source_id: battery_voltage
    name: "Battery Percentage"
    id: battery_percentage
    icon: "mdi:battery"
    web_server:
      sorting_group_id: power
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    filters:
      - calibrate_linear:
          datapoints:  # calibration curve matching factory firmware
            - 3.30 ->   0.0
            - 3.42 ->  10.0
            - 3.54 ->  20.0
            - 3.66 ->  30.0
            - 3.78 ->  40.0
            - 3.90 ->  50.0
            - 4.02 ->  60.0
            - 4.14 ->  70.0
            - 4.26 ->  80.0
            - 4.38 ->  90.0
            - 4.50 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
  - platform: adc
    pin: GPIO1
    id: chamber_temperature_voltage
    attenuation: auto
    update_interval: 30s
    internal: true
  - platform: resistance
    id: chamber_temperature_resistance
    sensor: chamber_temperature_voltage
    configuration: DOWNSTREAM
    resistor: 1kOhm
    reference_voltage: 3.3V
    internal: true
  - platform: ntc
    sensor: chamber_temperature_resistance
    name: "Chamber Temperature"
    id: chamber_temperature
    icon: "mdi:coolant-temperature"
    web_server:
      sorting_group_id: cooling
    internal: true  # using °F, if you prefer °C you can flip these
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 1kOhm
  - platform: copy
    source_id: chamber_temperature
    id: chamber_temperature_f
    icon: "mdi:coolant-temperature"
    web_server:
      sorting_group_id: cooling
    name: "Chamber Temperature"
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 9.0 / 5.0 + 32.0;
    on_value:
      then:
        - if:
            condition:
              - lambda: |
                  return id(chamber_temperature_f).state >= id(cooling_target).state;
              - switch.is_on: cooling_enabled
              - binary_sensor.is_on: ac_power  # matches stock behavior
            then:
              - switch.turn_on: tec_control_pin
            else:
              - switch.turn_off: tec_control_pin

  - platform: adc
    pin: GPIO3
    name: "Door Motor Current"
    id: door_motor_current
    icon: "mdi:current-dc"
    web_server:
      sorting_group_id: miscellaneous
    update_interval: 500ms
    attenuation: auto
    filters:
      - multiply: 1000
      - delta: 5
    unit_of_measurement: mV
    accuracy_decimals: 0
  # included here for reference: might interfere with wifi?
  # - platform: adc
  #   pin: GPIO5
  #   name: "Plate Motor Current"
  #   id: plate_motor_current
  #   icon: "mdi:current-dc"
  #   web_server:
  #     sorting_group_id: miscellaneous
  #   update_interval: 500ms
  #   attenuation: auto
  #   filters:
  #     - multiply: 1000
  #   unit_of_measurement: mV
  #   accuracy_decimals: 0
  - platform: template
    name: "Pet Visit Count"
    id: pet_visit_count
    icon: "mdi:paw"
    web_server:
      sorting_group_id: presence
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never
    lambda: 'return id(visit_count);'

  - platform: template
    name: "Last Visit Duration"
    id: last_visit_duration
    icon: "mdi:timer-sand"
    web_server:
      sorting_group_id: presence
    unit_of_measurement: "s"
    accuracy_decimals: 1
    update_interval: never
    lambda: 'return id(last_visit_seconds);'
    on_value:
      - lambda: 'id(last_visit_seconds) = x;'

  - platform: template
    name: "Total Time At Feeder"
    id: pet_total_time
    icon: "mdi:timer-sand-full"
    web_server:
      sorting_group_id: presence
    unit_of_measurement: "s"
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never
    lambda: 'return id(total_visit_seconds);'
binary_sensor:
  - platform: gpio
    name: "AC Power Present"
    id: ac_power
    icon: "mdi:cable-data"
    web_server:
      sorting_group_id: power
    pin:
      number: 0
      mode:
        input: true
    filters:
      - invert   # firmware reads LOW = AC present; invert so the entity reads ON when plugged in
    on_press:
      - logger.log:
          format: "AC Power reconnected"
          level: INFO
          tag: events
    on_release:
      then:
        - logger.log:
            format: "AC Power disconnected, disabling cooling to preserve battery"
            level: WARN
            tag: events
        - switch.turn_off: tec_control_pin
  - platform: gpio
    name: "Reset Button"
    icon: "mdi:restart-alert"
    web_server:
      sorting_group_id: power
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    internal: true
    filters:
      - delayed_on: 25ms
    on_press:
      - lambda: id(reset_button_press_start) = millis();
    on_release:
      - lambda: |-
          uint32_t held = millis() - id(reset_button_press_start);
          if (held >= 2000) {
            ESP_LOGD("reset_button", "Triggering restart");
            id(restart_button).press();
          }
  - platform: gpio
    name: "Pet Present"
    id: presence_detector
    icon: "mdi:waveform"
    web_server:
      sorting_group_id: presence
    pin:
      number: 20
      mode:
        input: true
    filters:
      - delayed_on: 1s  # acts as debounce for a cat that just walks by
      - delayed_off: 10s  # sensor is not super long-range, maybe the cat just takes a second between bites...
    on_press:
      - logger.log:
          format: "presence_detector: ON"
          level: INFO
          tag: sensors
      - lambda: |-
          id(visit_start_time) = millis() - 1000;
          id(visit_in_progress) = true;
          id(visit_count) += 1;
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            id(last_visit_epoch) = now.timestamp - 1;
          }
      - component.update: pet_visit_count
      - component.update: last_visit_time
    on_release:
      - logger.log:
          format: "presence_detector: OFF"
          level: INFO
          tag: sensors
      - lambda: |-
          if (id(visit_in_progress)) {
            float duration_s = (millis() - id(visit_start_time) - 10000) / 1000.0;  // undo delayed_off
            id(total_visit_seconds) += duration_s;
            id(last_visit_duration).publish_state(duration_s);
            id(pet_total_time).publish_state(id(total_visit_seconds));
            id(visit_in_progress) = false;
          }
  - platform: template
    name: "Missed Meal"
    id: missed_meal_warning_sensor
    icon: "mdi:food-off"
    device_class: problem
    web_server:
      sorting_group_id: feed
    lambda: return id(missed_meal_warning);
  - platform: gpio
    id: plate_grating_raw
    internal: true
    web_server:
      sorting_group_id: miscellaneous
    pin:
      number: 10
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - logger.log:
          format: "plate_grating_raw: ON"
          level: DEBUG
          tag: sensors
    on_release:
      - logger.log:
          format: "plate_grating_raw: OFF"
          level: DEBUG
          tag: sensors
  - platform: gpio
    id: door_grating_raw
    web_server:
      sorting_group_id: miscellaneous
    internal: true
    pin:
      number: 19
      mode:
        input: true
    on_press:
      - logger.log:
          format: "door_grating_raw: ON"
          level: DEBUG
          tag: sensors
    on_release:
      - logger.log:
          format: "door_grating_raw: OFF"
          level: DEBUG
          tag: sensors
text_sensor:
  - platform: template
    name: "Last Visit"
    id: last_visit_time
    icon: "mdi:clock-outline"
    device_class: timestamp
    web_server:
      sorting_group_id: presence
    update_interval: never
    lambda: |-
      if (id(last_visit_epoch) == 0) {
        return {};
      }
      return ESPTime::from_epoch_utc(id(last_visit_epoch)).strftime("%Y-%m-%dT%H:%M:%SZ");
  - platform: template
    id: hardware_version
    name: "Hardware Version"
    icon: "mdi:tag-outline"
    web_server:
      sorting_group_id: miscellaneous
    update_interval: never
    internal: true
    # P0_0/P0_1 (AW9523 IN_P0 bits 0-1) are a fixed hardware-revision
    # strap read once by the factory firmware's GetHardwareVersion
    # not sure it's used
    lambda: |-
      const bool p0_0 = id(expander)->digital_read(0);
      const bool p0_1 = id(expander)->digital_read(1);

      if (!p0_0 && p0_1) {
        return {"5.1.0"};
      } else if (p0_0 && !p0_1) {
        return {"5.2.0"};
      } else {
        return {"Unknown"};
      }
button:
  - platform: restart
    name: "Restart"
    id: restart_button
    internal: true
  - platform: template
    name: "Play Chime"
    id: chime
    icon: "mdi:bell-ring"
    web_server:
      sorting_group_id: core
    on_press:
      # stock firmware also sends 0xEF on feed plan reset, likely a command
      - lambda: |-
          const uint8_t byte = 0x01;
          id(chime_pin).turn_off();
          delay_microseconds_safe(5000);
          for (int i = 0; i < 8; i++) {
            const bool bit = (byte >> i) & 1;
            id(chime_pin).turn_on();
            delay_microseconds_safe(bit ? 3000 : 1000);
            id(chime_pin).turn_off();
            delay_microseconds_safe(bit ? 1000 : 3000);
          }
          id(chime_pin).turn_on();  // idle
  - platform: template
    name: "Rotate Plate"
    id: rotate_plate
    icon: "mdi:rotate-right-variant"
    web_server:
      sorting_group_id: core
    on_press:
      - switch.turn_on: plate_grating_sensor_power
      - delay: 300ms  # observed flaky plate rotation that may be caused by grating power-up
      - switch.turn_on: plate_p0_5
      - switch.turn_on: plate_p0_6
      - wait_until:
          condition:
            binary_sensor.is_off: plate_grating_raw
          timeout: 3400ms
      - wait_until:
          condition:
            binary_sensor.is_on: plate_grating_raw
          timeout: 3400ms
      - switch.turn_off: plate_p0_6
      - switch.turn_off: plate_grating_sensor_power
  - platform: template
    name: "Toggle Lid"
    icon: "mdi:swap-vertical"
    web_server:
      sorting_group_id: core
    on_press:
      then:
        - if:
            condition:
              - switch.is_off: toggle_door_closed
            then:
              - if:
                  condition:
                    binary_sensor.is_off: presence_detector
                  then:
                    - switch.turn_on: toggle_door_closed
                  else:
                    - logger.log:
                        format: 'skipping close, presence detected'
                        tag: 'lid'
            else:
              - switch.turn_off: toggle_door_closed
  - platform: template
    name: "Feed Now"
    icon: "mdi:food-turkey"
    web_server:
      sorting_group_id: feed
    on_press:
      then:
        - script.execute:
            id: feed_script
            manual: true


name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build changelog
        id: changelog
        uses: ardalanamini/auto-changelog@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-name: ${{ steps.tag_version.outputs.new_tag }}
          default-commit-type: Other Changes
          commit-types: |
            feat: Features
            fix: Bug Fixes
            perf: Performance Improvements
            revert: Reverts
            refactor: Refactoring
            docs: Documentation
            style: Code Style
            test: Tests
            build: Build System & Dependencies
            ci: Continuous Integration
            chore: Chores

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.changelog.outputs.changelog }}

      - name: Get major version tag
        id: major_tag
        run: echo "tag=$(echo '${{ steps.tag_version.outputs.new_tag }}' | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Move floating major version tag
        uses: EndBug/latest-tag@v1
        with:
          ref: ${{ steps.major_tag.outputs.tag }}

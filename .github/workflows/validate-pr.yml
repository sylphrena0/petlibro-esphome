name: Validate PR

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Lint PR title
        id: lint_pr_title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on invalid PR title
        if: always() && steps.lint_pr_title.outputs.error_message != null
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-title-lint-error
          message: |
            We require pull request titles to follow the [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) format, with a scope matching the component this PR touches (e.g. `fix(plaf109): correct lid timing`, `feat(plaf108): add stall detection`, `docs: update flashing steps`).

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      - name: Delete resolved title comment
        if: steps.lint_pr_title.outputs.error_message == null
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-title-lint-error
          delete: true

  validate-esphome-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - plaf108/config.yaml
          - plwf105/config.yaml
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Write dummy secrets.yaml
        run: |
          dir=$(dirname '${{ matrix.config }}')
          cat > "$dir/secrets.yaml" <<'EOF'
          wifi_ssid: "ci-dummy-ssid"
          wifi_password: "ci-dummy-password"
          EOF

      - name: Build ${{ matrix.config }}
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: ${{ matrix.config }}

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get changed YAML files
        id: changed-yaml
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.yaml
            **/*.yml

      - name: yamllint
        if: steps.changed-yaml.outputs.any_changed == 'true'
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          file_or_dir: ${{ steps.changed-yaml.outputs.all_changed_files }}
